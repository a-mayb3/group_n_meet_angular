<article class="event-card" role="article">
  <h3 class="event-title">
    <a *ngIf="id; else plainTitle" href="#" (click)="open($event)">{{ title }}</a>
    <ng-template #plainTitle>{{ title }}</ng-template>
  </h3>

  <p *ngIf="description" class="event-description">{{ description }}</p>

  <div class="event-meta">
    <small *ngIf="event?.starts_at || event?.start_time"
      >Starts: {{ event.starts_at ?? event.start_time }}</small
    >
    <small *ngIf="event?.location"> • {{ event.location }}</small>
  </div>
</article>
