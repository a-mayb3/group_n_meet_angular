<div class="group-page">
  <div *ngIf="loading" class="loading">Loading organizer group…</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <section *ngIf="!loading && group" class="group-detail">
    <h1 class="group-name">{{ group.display_name ?? group.name ?? 'Organizer Group' }}</h1>

    <p class="group-meta">
      <small *ngIf="group.id">ID: {{ group.id }}</small>
      <small *ngIf="group.created"> • Created: {{ group.created }}</small>
    </p>

    <div *ngIf="group.description" class="group-description">{{ group.description }}</div>

    <button
      *ngIf="currentUserIsGroupMember"
      type="button"
      class="edit-button"
      (click)="navigateToEditGroup()"
    >
      Edit
    </button>
  </section>

  <app-events-list
    *ngIf="!loading && group"
    [events]="events"
    title="Events by this organizer"
    emptyMessage="No events"
  ></app-events-list>
</div>
