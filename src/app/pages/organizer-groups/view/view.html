<div class="group-page">
  <div *ngIf="loading" class="loading">Loading organizer group…</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <section *ngIf="!loading && group" class="group-detail">
    <h1 class="group-name">{{ group.display_name ?? group.name ?? 'Organizer Group' }}</h1>

    <div *ngIf="group.description" class="group-description">{{ group.description }}</div>
    <ul class="group-meta">
      <li *ngIf="group.id">ID: {{ group.id }}</li>
      <li *ngIf="group.created">Created: {{ group.created }}</li>
    </ul>
  </section>
  <section class="actions">
    <button
      *ngIf="currentUserIsGroupMember"
      type="button"
      class="edit-button"
      (click)="navigateToEditGroup()"
    >
      Edit
    </button>

    <button
      *ngIf="currentUserIsGroupMember"
      type="button"
      class="leave-button"
      (click)="leaveGroup()"
      [disabled]="leaving"
    >
      {{ leaving ? 'Leaving...' : 'Leave Group' }}
    </button>

    <button
      *ngIf="!currentUserIsGroupMember"
      type="button"
      class="join-button"
      (click)="joinGroup()"
      [disabled]="joining"
    >
      {{ joining ? 'Joining...' : 'Add me to this group' }}
    </button>
  </section>

  <app-events-list
    *ngIf="!loading && group"
    [events]="events"
    title="Events by this organizer"
    emptyMessage="No events"
  ></app-events-list>

  <section *ngIf="!loading && group" class="group-members">
    <h2>Members</h2>
    <div *ngIf="groupMembers.length; else noMembers" class="member-list">
      <app-member-card *ngFor="let m of groupMembers" [member]="m"></app-member-card>
    </div>
    <ng-template #noMembers>
      <div class="empty not-found">No members listed for this group</div>
    </ng-template>
  </section>
</div>
