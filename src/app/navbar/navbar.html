<nav>
  <div class="nav-left">
    <a class="brand" routerLink="/">Group N Meet</a>
  </div>

  <form class="navbar-search-form" (ngSubmit)="onSubmit()" role="search" aria-label="Global search">
    <input name="name" [(ngModel)]="name" placeholder="Event name" aria-label="Event name" />
    <button type="submit">Search</button>
  </form>

  <div class="nav-right">
    <ng-container *ngIf="currentUser$ | async as user; else loginLink">
      <a class="username" [routerLink]="['/profile']" aria-label="Account">
        {{ user.display_name || user.displayName || user.name || user.email || user.email_address || 'Account' }}
      </a>
    </ng-container>
    <ng-template #loginLink>
      <a class="login-link" routerLink="/login" aria-label="Login">Login</a>
    </ng-template>
  </div>
</nav>
